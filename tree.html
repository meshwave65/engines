<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>File Manager Test</title>

  <style>
    body {
      margin: 0;
      display: flex;
      height: 100vh;
      font-family: Arial;
      background: #0f172a;
      color: #cbd5e1;
    }

    #left {
      width: 320px;
      border-right: 1px solid #1e293b;
      overflow: auto;
      padding: 10px;
    }

    #right {
      flex: 1;
      padding: 20px;
      overflow: auto;
    }

    .item {
      padding: 8px;
      margin: 4px 0;
      cursor: pointer;
      border-radius: 6px;
      background: #111827;
    }

    .item:hover {
      background: #1f2937;
    }

    .active {
      background: #2563eb !important;
    }

    pre {
      white-space: pre-wrap;
      background: #0b1220;
      padding: 10px;
      border-radius: 8px;
    }

    iframe {
      width: 100%;
      height: 90vh;
      border: none;
      background: white;
    }

    img {
      max-width: 100%;
    }
  </style>
</head>

<body>

<div id="left">
  <h3>File Tree</h3>
  <div id="tree"></div>
</div>

<div id="right">
  <h3 id="title">Preview</h3>
  <div id="preview">Select a file</div>
</div>

<script>

const API = "https://appsofia.meshwave.com.br/files";
const USER = "jpds";
const CLIENT = "7891b8f4-68cc-4344-89e1-c000b80918bb";

let DATA = [];

// ======================
// LOAD TREE
// ======================
async function load() {
  const url = `${API}?user_name=${USER}&client_id=${CLIENT}`;
  const res = await fetch(url);
  const json = await res.json();

  DATA = json?.data?.providers || [];
  renderTree();
}

// ======================
// RENDER TREE
// ======================
function renderTree() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";

  if (!DATA.length) {
    tree.innerHTML = "<div>Nenhum arquivo encontrado</div>";
    return;
  }

  DATA.forEach(provider => {

    const p = document.createElement("div");
    p.className = "item";
    p.innerHTML = "📁 " + provider.provider;
    tree.appendChild(p);

    (provider.tasks || []).forEach(task => {

      const t = document.createElement("div");
      t.className = "item";
      t.style.marginLeft = "15px";
      t.innerHTML = "📂 " + task.task_id;
      tree.appendChild(t);

      (task.files || []).forEach(file => {

        const f = document.createElement("div");
        f.className = "item";
        f.style.marginLeft = "30px";
        f.innerHTML = "📄 " + file.filename;

        f.onclick = () => preview(file, f);

        tree.appendChild(f);

      });

    });

  });
}

// ======================
// PREVIEW ENGINE
// ======================
async function preview(file, el) {

  document.querySelectorAll(".item").forEach(i => i.classList.remove("active"));
  el.classList.add("active");

  const ext = file.filename.split(".").pop().toLowerCase();

  // IMPORTANTE: força inline para evitar download automático
  const url = `https://appsofia.meshwave.com.br/api/file?path=${encodeURIComponent(file.path)}&download=false`;

  const preview = document.getElementById("preview");
  const title = document.getElementById("title");

  title.innerText = file.filename;
  preview.innerHTML = "Loading...";

  // ======================
  // IMAGEM
  // ======================
  if (["png","jpg","jpeg","webp","gif"].includes(ext)) {
    preview.innerHTML = `<img src="${url}" />`;
    return;
  }

  // ======================
  // PDF (ROBUSTO)
  // ======================
  if (ext === "pdf") {
    preview.innerHTML = `
      <iframe src="${url}"></iframe>
    `;
    return;
  }

  // ======================
  // DOC / DOCX (REAL fallback)
  // ======================
  if (ext === "doc" || ext === "docx") {

    const googleViewer = `https://docs.google.com/gview?url=${encodeURIComponent(url)}&embedded=true`;

    preview.innerHTML = `
      <iframe src="${googleViewer}"></iframe>
      <div style="margin-top:10px;">
        <a href="${url}" target="_blank" style="color:#4ea1ff;">
          Abrir / Baixar arquivo original
        </a>
      </div>
    `;
    return;
  }

  // ======================
  // TEXTO
  // ======================
  try {
    const text = await fetch(url).then(r => r.text());
    preview.innerHTML = `<pre>${text || "empty"}</pre>`;
  } catch (e) {
    preview.innerHTML = `<pre>Erro ao carregar arquivo</pre>`;
  }
}

load();

</script>

</body>
</html>
